name: check

# main gets no CI runs: it only moves by release PRs, which are checked here.
on:
  push:
    branches: [dev]
  pull_request:

jobs:
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inst/viewer-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # a PR's merge commit and its base parent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inst/viewer-src/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # inst/viewer/ is built and committed on dev by the bundle job after merge.
      - name: PRs leave inst/viewer/ to CI
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        run: |
          if git diff --name-only HEAD^1 HEAD -- ../viewer | grep -q .; then
            echo "::error::This PR changes inst/viewer/. CI builds it after merge; run 'git restore inst/viewer' (or revert those changes) and push again."
            exit 1
          fi
      # Release PRs (dev -> main) carry dev's bundle; it must match the source,
      # e.g. not be merged before dev's bundle job has committed
      - name: Release PRs carry a current inst/viewer/
        if: github.event_name == 'pull_request' && github.head_ref == 'dev'
        run: |
          if [ -n "$(git status --porcelain -- ../viewer)" ]; then
            git status --short -- ../viewer
            echo "::error::inst/viewer/ on dev does not match its source. Wait for dev's bundle job to commit it, then rerun this check."
            exit 1
          fi

  # Build the viewer after a merge into dev and commit it, so installs from dev
  # and, after a release, main (install_github(), pak) get a bundle without
  # Node. Pushes made with GITHUB_TOKEN do not start new workflow runs.
  # Nothing here writes to main.
  bundle:
    if: github.event_name == 'push'
    needs: viewer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bundle-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch tip, to commit on top of
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inst/viewer-src/package-lock.json
      - run: npm ci && npm run build
        working-directory: inst/viewer-src
      - name: Commit the bundle if it changed
        run: |
          git add -A inst/viewer
          if git diff --cached --quiet; then
            echo "inst/viewer/ is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build viewer bundle" -m "Built from ${GITHUB_SHA}."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: echo "CHROMOTE_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::giotto-suite/GiottoClass
            github::giotto-suite/GiottoDisk
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
