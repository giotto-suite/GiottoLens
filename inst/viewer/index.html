<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GiottoLens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111827; overflow: hidden; font-family: monospace; }
    canvas { position: absolute; inset: 0; }

    #hud {
      position: absolute; top: 12px; left: 12px;
      color: #d1d5db; font-size: 12px; line-height: 1.6;
      background: rgba(17,24,39,0.75); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 5px; padding: 3px 10px;
      pointer-events: none; user-select: none;
    }
    #status { position: absolute; top: 12px; right: 276px; color: #6b7280; font-size: 12px; }
    #tx-sample    { margin-left: 10px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,0.12); color: #6b7280; font-size: 11px; }
    #cursor-coords { margin-left: 10px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,0.12); color: #6b7280; font-size: 11px; font-family: monospace; }
    #ruler-label {
      position: absolute; display: none; pointer-events: none;
      background: rgba(17,24,39,0.85); border: 1px solid #374151; border-radius: 4px;
      padding: 2px 6px; color: #fef08a; font-size: 11px; font-family: monospace;
      white-space: nowrap; z-index: 10;
    }
    #ruler-label.visible { display: block; }

    #annot-popup {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      background: rgba(17,24,39,0.92); border: 1px solid #1f2937; border-radius: 6px;
      padding: 10px 12px; display: none; flex-direction: column; gap: 6px;
      pointer-events: all; z-index: 10; min-width: 160px;
    }
    #annot-popup.visible { display: flex; }
    #annot-type { font-size: 10px; color: #4b5563; text-transform: uppercase; letter-spacing: 0.05em; }
    #annot-name {
      width: 100%; padding: 4px 8px; background: #1f2937;
      border: 1px solid #374151; border-radius: 4px;
      color: #e5e7eb; font-size: 12px; font-family: monospace; outline: none;
    }
    #annot-name:focus { border-color: #4b5563; }

    #panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 260px;
      background: rgba(17,24,39,0.92); border-left: 1px solid #1f2937;
      display: flex; flex-direction: column; color: #d1d5db; font-size: 12px;
    }
    #panel-header { padding: 12px 12px 8px; border-bottom: 1px solid #1f2937; flex-shrink: 0; }
    #panel-header h3 { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    #gene-search {
      width: 100%; padding: 5px 8px;
      background: #1f2937; border: 1px solid #374151; border-radius: 4px;
      color: #e5e7eb; font-size: 12px; font-family: monospace; outline: none;
    }
    #gene-search:focus { border-color: #4b5563; }
    #panel-actions { display: flex; gap: 6px; margin-top: 8px; }
    #panel-actions button {
      flex: 1; padding: 4px; background: #1f2937;
      border: 1px solid #374151; border-radius: 4px;
      color: #9ca3af; font-size: 11px; font-family: monospace; cursor: pointer;
    }
    #panel-actions button:hover { background: #374151; color: #e5e7eb; }
    #btn-color-all.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
    #sel-count { color: #6b7280; font-size: 11px; margin-top: 6px; }

    #gene-list { flex: 1; overflow-y: auto; padding: 4px 0; }
    #gene-list::-webkit-scrollbar { width: 4px; }
    #gene-list::-webkit-scrollbar-track { background: transparent; }
    #gene-list::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }

    .gene-row { display: flex; align-items: center; gap: 7px; padding: 3px 12px; cursor: pointer; user-select: none; }
    .gene-row:hover { background: #1f2937; }
    .gene-row.selected { background: #1e2d40; }
    .gene-dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; border: 1px solid #374151; }
    .gene-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gene-row.selected .gene-name { color: #e5e7eb; }
    .gene-row:not(.selected) .gene-name { color: #6b7280; }
    #list-overflow { padding: 6px 12px; color: #4b5563; font-size: 11px; }

    #annot-panel { flex-shrink: 0; border-top: 1px solid #1f2937; max-height: 160px; overflow-y: auto; padding: 8px 0 4px; }
    #annot-panel h3 { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; padding: 0 12px; }
    #annot-panel::-webkit-scrollbar { width: 4px; }
    #annot-panel::-webkit-scrollbar-track { background: transparent; }
    #annot-panel::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    .annot-row { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 12px; cursor: pointer; user-select: none; }
    .annot-row:hover { background: #1f2937; }
    .annot-row.selected { background: #1e2d40; }
    .annot-type-tag { flex-shrink: 0; font-size: 9px; font-family: monospace; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; }
    .annot-type-tag.polygon   { background: #1e3a5f; color: #93c5fd; }
    .annot-type-tag.rectangle { background: #1a3a2a; color: #6ee7b7; }
    .annot-type-tag.freehand  { background: #3a2a1a; color: #fcd34d; }
    .annot-name-text { flex: 1; font-size: 11px; color: #9ca3af; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .annot-unnamed { color: #4b5563; font-style: italic; }
    .annot-row-btn { background: none; border: none; padding: 2px; color: #4b5563; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
    .annot-row-btn:hover { color: #9ca3af; }
    .annot-row-btn svg { width: 12px; height: 12px; }

    #meta-panel { flex-shrink: 0; padding: 8px 12px 10px; border-top: 1px solid #1f2937; }
    #meta-panel h3 { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    #meta-col-select {
      flex: 1; padding: 4px 6px; background: #1f2937;
      border: 1px solid #374151; border-radius: 4px;
      color: #e5e7eb; font-size: 11px; font-family: monospace; outline: none;
    }
    #alpha-panel { flex-shrink: 0; padding: 8px 12px 10px; border-top: 1px solid #1f2937; }
    #alpha-panel h3 { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .alpha-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; color: #6b7280; }
    .alpha-row label { width: 72px; flex-shrink: 0; }
    .alpha-row input[type=range] { flex: 1; height: 3px; accent-color: #4b5563; cursor: pointer; }
    .alpha-row input[type=range]:disabled { opacity: 0.3; cursor: default; }
    .alpha-row input[type=checkbox] { flex-shrink: 0; cursor: pointer; accent-color: #4b5563; }
    .alpha-val { width: 26px; text-align: right; color: #9ca3af; }

    #toolbar {
      position: absolute; bottom: 20px;
      left: calc((100vw - 260px) / 2); transform: translateX(-50%);
      display: flex; align-items: center; gap: 3px;
      background: rgba(17,24,39,0.88); border: 1px solid #374151; border-radius: 6px;
      padding: 4px; pointer-events: all; user-select: none; z-index: 10;
    }
    .tool-btn {
      padding: 5px 7px; background: none; border: 1px solid transparent; border-radius: 4px;
      color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .tool-btn svg { width: 15px; height: 15px; stroke-width: 1.75; pointer-events: none; }
    .tool-btn:hover { background: #374151; color: #e5e7eb; }
    .tool-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
    .tool-sep { width: 1px; height: 16px; background: #374151; margin: 0 2px; flex-shrink: 0; }
    .tool-group { position: relative; }
    .tool-submenu {
      display: none; flex-direction: column; gap: 3px;
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: rgba(17,24,39,0.92); border: 1px solid #374151; border-radius: 6px; padding: 4px;
    }
    .tool-group.open .tool-submenu { display: flex; }

    #r-status {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-left: 5px; vertical-align: middle; background: #4b5563;
    }
    #r-status.connected    { background: #34d399; }
    #r-status.disconnected { background: #f87171; }

    #scalebar {
      position: absolute; bottom: 20px; left: 12px;
      pointer-events: none; user-select: none;
      display: flex; flex-direction: column; align-items: flex-start;
    }
    #scalebar-bar {
      height: 6px; border: 2px solid #d1d5db; border-bottom: none;
      box-sizing: border-box;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    }
    #scalebar-label {
      color: #d1d5db; font-size: 11px; font-family: monospace;
      margin-top: 3px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <canvas id="deck-canvas"></canvas>
  <div id="hud">GiottoLens<span id="r-status" title="R connection"></span><span id="tx-sample"></span><span id="cursor-coords"></span></div>
  <div id="toolbar">
    <button class="tool-btn active" data-mode="pan" title="pan"><i data-lucide="hand"></i></button>
    <button class="tool-btn" data-mode="ruler" title="ruler"><i data-lucide="ruler"></i></button>
    <div class="tool-sep"></div>
    <div class="tool-group" id="group-draw">
      <button class="tool-btn tool-group-btn" id="btn-group-draw" title="draw"><i data-lucide="pencil"></i></button>
      <div class="tool-submenu">
        <button class="tool-btn" data-mode="poly" title="polygon"><i data-lucide="pentagon"></i></button>
        <button class="tool-btn" data-mode="rect" title="rectangle"><i data-lucide="square"></i></button>
        <button class="tool-btn" data-mode="freehand" title="freehand"><i data-lucide="spline"></i></button>
      </div>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group" id="group-select">
      <button class="tool-btn tool-group-btn" id="btn-group-select" title="select"><i data-lucide="mouse-pointer-2"></i></button>
      <div class="tool-submenu">
        <button class="tool-btn" data-mode="lasso" title="lasso"><i data-lucide="lasso"></i></button>
        <button class="tool-btn" id="tool-clear-sel" title="clear selection"><i data-lucide="circle-x"></i></button>
      </div>
    </div>
  </div>
  <div id="scalebar">
    <div id="scalebar-bar"></div>
    <span id="scalebar-label"></span>
  </div>
  <div id="ruler-label"></div>
  <div id="annot-popup">
    <span id="annot-type"></span>
    <input id="annot-name" type="text" placeholder="name…" autocomplete="off" spellcheck="false">
  </div>
  <div id="status">initializing…</div>

  <div id="panel">
    <div id="panel-header">
      <h3>Transcripts</h3>
      <input id="gene-search" type="text" placeholder="search genes…" autocomplete="off" spellcheck="false">
      <div id="panel-actions">
        <button id="btn-color-all">color all</button>
        <button id="btn-palette">muted</button>
        <button id="btn-clear">clear</button>
      </div>
      <div id="sel-count"></div>
    </div>
    <div id="gene-list"></div>
    <div id="annot-panel" style="display:none">
      <h3>Annotations</h3>
      <div id="annot-list"></div>
    </div>
    <div id="meta-panel" style="display:none">
      <h3>Cells</h3>
      <div class="alpha-row">
        <label>color by</label>
        <select id="meta-col-select"><option value="">none</option></select>
      </div>
    </div>
    <div id="alpha-panel">
      <h3>Opacity</h3>
      <div class="alpha-row">
        <input type="checkbox" id="show-overview" checked>
        <label>density</label>
        <input type="range" id="alpha-overview" min="0" max="100" value="80">
        <span class="alpha-val" id="val-overview">80</span>
      </div>
      <div class="alpha-row">
        <input type="checkbox" id="show-poly" checked>
        <label>cells</label>
        <input type="range" id="alpha-poly" min="0" max="100" value="60">
        <span class="alpha-val" id="val-poly">60</span>
      </div>
      <div class="alpha-row">
        <input type="checkbox" id="show-tx">
        <label>transcripts</label>
        <input type="range" id="alpha-tx" min="0" max="100" value="70">
        <span class="alpha-val" id="val-tx">70</span>
      </div>
      <div class="alpha-row">
        <input type="checkbox" id="show-annotations" checked>
        <label>annotations</label>
        <input type="range" id="alpha-annotations" min="0" max="100" value="60">
        <span class="alpha-val" id="val-annotations">60</span>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/deck.gl@9.1.0/dist.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="./main.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons())</script>
</body>
</html>
