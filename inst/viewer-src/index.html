<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GiottoLens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Colours as tokens, dark by default and light with data-theme="light" on
       the page (ui/theme.ts). The spatial view and the scatter canvas
       (.lens-dark) keep the dark ones in both: their colours (selection,
       uncoloured cells, image channels) are chosen for a dark background.
       Their tools and readouts are page controls and take the page's (the
       spatial toolbar, hud and cell tooltip here, the scatter's tools by not
       being .lens-dark).
       color-scheme sets the browser's own controls to match. */
    :root, .spatial-pane, .lens-dark {
      color-scheme: dark;
      --bg-0: #0d1117; --bg-1: #111827; --bg-2: #1f2937; --bg-3: #374151;
      --fg-0: #e5e7eb; --fg-1: #d1d5db; --fg-2: #9ca3af; --fg-3: #6b7280; --fg-4: #4b5563;
      --accent: #3b82f6; --accent-fg: #93c5fd; --accent-bg: #1e3a5f; --accent-bg-hover: #1e4a7f; --row-sel: #1e2d40;
      --tag-green-bg: #1a3a2a; --tag-green-fg: #6ee7b7; --tag-amber-bg: #3a2a1a; --tag-amber-fg: #fcd34d;
    }
    :root[data-theme="light"], :root[data-theme="light"] .spatial-pane :is(.toolbar, .hud, .cell-tooltip) {
      color-scheme: light;
      --bg-0: #ffffff; --bg-1: #f3f4f6; --bg-2: #e5e7eb; --bg-3: #d1d5db;
      --fg-0: #111827; --fg-1: #374151; --fg-2: #4b5563; --fg-3: #6b7280; --fg-4: #9ca3af;
      --accent: #3b82f6; --accent-fg: #1d4ed8; --accent-bg: #dbeafe; --accent-bg-hover: #bfdbfe; --row-sel: #dbeafe;
      --tag-green-bg: #d1fae5; --tag-green-fg: #047857; --tag-amber-bg: #fef3c7; --tag-amber-fg: #b45309;
    }
    .lens-dark { background: var(--bg-0); }
    /* Every scrollbar in the viewer's colours, panels made at runtime included */
    * { scrollbar-width: thin; scrollbar-color: var(--bg-3) transparent; }
    body { background: var(--bg-1); overflow: hidden; font-family: monospace; }
    canvas { position: absolute; inset: 0; }

    .hud {
      position: absolute; top: 12px; left: 12px;
      color: var(--fg-1); font-size: 12px; line-height: 1.6;
      background: color-mix(in srgb, var(--bg-1) 75%, transparent); border: 1px solid var(--bg-2);
      border-radius: 5px; padding: 3px 10px;
      pointer-events: none; user-select: none;
    }
    .hud:not(:has(.hud-item:not(:empty))) { display: none; }
    .hud-item { color: var(--fg-3); font-size: 11px; }
    .hud-item:not(:empty) ~ .hud-item:not(:empty) { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--bg-3); }
    .cursor-coords { font-family: monospace; }
    .ruler-label {
      position: absolute; display: none; pointer-events: none;
      background: rgba(17,24,39,0.85); border: 1px solid var(--bg-3); border-radius: 4px;
      padding: 2px 6px; color: #fef08a; font-size: 11px; font-family: monospace;
      white-space: nowrap; z-index: 10;
    }
    .ruler-label.visible { display: block; }

    .cell-tooltip {
      position: absolute; display: none; pointer-events: none;
      background: color-mix(in srgb, var(--bg-1) 92%, transparent); border: 1px solid var(--bg-3); border-radius: 4px;
      padding: 5px 8px; color: var(--fg-1); font-size: 11px; font-family: monospace;
      white-space: nowrap; z-index: 11; max-width: 260px;
    }
    .cell-tooltip.visible { display: block; }
    .cell-tooltip .ctt-id { color: #fef08a; }
    :root[data-theme="light"] .cell-tooltip .ctt-id { color: var(--tag-amber-fg); }
    .cell-tooltip .ctt-row { display: flex; gap: 8px; line-height: 1.5; }
    .cell-tooltip .ctt-key { color: var(--fg-3); flex: 0 0 auto; }
    .cell-tooltip .ctt-val { color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; }
    .cell-tooltip .ctt-sep { height: 1px; background: var(--bg-2); margin: 3px 0; }
    .cell-tooltip .ctt-overflow { color: var(--fg-4); font-size: 10px; margin-top: 2px; }

    /* The tools bar's save form, beside its button (panels/tools.ts) */
    .meta-sel-panel {
      position: fixed;
      background: rgba(17,24,39,0.92); border: 1px solid var(--bg-2); border-radius: 6px;
      padding: 8px 10px; display: none; flex-direction: column; gap: 6px;
      pointer-events: all; z-index: 1000; min-width: 200px;
    }
    .meta-sel-panel.visible { display: flex; }
    .meta-sel-row { display: flex; gap: 6px; }
    .meta-sel-row select, .meta-sel-row input {
      flex: 1; padding: 4px 6px; background: var(--bg-2);
      border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-0); font-size: 11px; font-family: monospace; outline: none;
    }
    .meta-sel-row select:focus, .meta-sel-row input:focus { border-color: var(--fg-4); }
    .meta-sel-apply {
      padding: 4px 10px; background: var(--accent-bg); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--accent-fg); font-size: 11px; cursor: pointer; white-space: nowrap;
    }
    .meta-sel-apply:hover { background: var(--accent-bg-hover); }
    .meta-sel-apply:disabled { opacity: 0.5; cursor: default; }
    .save-panel { min-width: 260px; }
    .save-status { color: var(--fg-3); font-size: 11px; font-family: monospace; min-height: 1.3em; }
    .save-status.error { color: #fca5a5; }

    .tx-lasso-panel {
      position: absolute; right: 12px; bottom: 60px;
      background: rgba(17,24,39,0.95); border: 1px solid var(--bg-3); border-radius: 6px;
      display: none; flex-direction: column;
      pointer-events: all; z-index: 10; width: 220px; max-height: 340px;
    }
    .tx-lasso-panel.visible { display: flex; }
    .tx-lasso-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-bottom: 1px solid var(--bg-2); flex-shrink: 0;
    }
    .tx-lasso-title { font-size: 11px; color: #fbbf24; }
    .tx-lasso-close {
      background: none; border: none; color: var(--fg-3); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 0 2px;
    }
    .tx-lasso-close:hover { color: var(--fg-0); }
    .tx-lasso-results { overflow-y: auto; padding: 4px 0; flex: 1; }
    .tx-gene-row {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 10px; font-size: 11px;
    }
    .tx-gene-row:hover { background: rgba(255,255,255,0.04); }
    .tx-gene-name { flex: 1; color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-gene-bar-wrap { width: 50px; height: 4px; background: var(--bg-2); border-radius: 2px; flex-shrink: 0; }
    .tx-gene-bar { height: 100%; background: #fbbf24; border-radius: 2px; }
    .tx-gene-count { color: var(--fg-2); width: 36px; text-align: right; flex-shrink: 0; }

    /* A name edited in place in a list (ui/rename.ts) */
    .name-edit {
      flex: 1; min-width: 0; padding: 1px 4px; background: var(--bg-2); border: 1px solid var(--fg-4);
      border-radius: 3px; color: var(--fg-0); font-size: 11px; font-family: monospace; outline: none;
    }
    .name-edit.invalid { border-color: #ef4444; }

    /* The transcripts panel (panels/transcripts.ts) */
    .gene-head { flex-shrink: 0; border-bottom: 1px solid var(--bg-2); }
    .ctl-input {
      width: 100%; padding: 5px 8px;
      background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-0); font-size: 12px; font-family: monospace; outline: none;
    }
    .ctl-input:focus { border-color: var(--fg-4); }
    .ctl-actions { display: flex; gap: 6px; margin-top: 8px; }
    .ctl-actions button {
      flex: 1; padding: 4px; background: var(--bg-2);
      border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-2); font-size: 11px; font-family: monospace; cursor: pointer;
    }
    .ctl-actions button:hover { background: var(--bg-3); color: var(--fg-0); }
    .ctl-actions button.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-fg); }
    /* A chart's view tools (panels/controls.js): a column over the chart's lower right */
    .chart-tools {
      position: absolute; right: 8px; bottom: 8px; z-index: 5;
      display: flex; flex-direction: column; gap: 2px; padding: 3px;
      background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 6px; opacity: 0.92;
    }
    .gene-count { color: var(--fg-3); font-size: 11px; margin-left: 6px; align-self: center; }

    .gene-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; font-size: 12px; }

    .gene-row { display: flex; align-items: center; gap: 7px; padding: 3px 12px; cursor: pointer; user-select: none; }
    .gene-row:hover { background: var(--bg-2); }
    .gene-row.selected { background: var(--row-sel); }
    .gene-dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--bg-3); }
    .gene-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gene-row.selected .gene-name { color: var(--fg-0); }
    .gene-row:not(.selected) .gene-name { color: var(--fg-3); }
    .list-overflow { padding: 6px 12px; color: var(--fg-4); font-size: 11px; }

    /* The Data panel (panels/data.ts) */
    .data-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    /* A short panel scrolls as a whole rather than squeezing the list away */
    .data-list { min-height: 96px; }
    .data-item.loaded .gene-name { font-style: italic; }
    .data-mark { flex-shrink: 0; color: var(--fg-4); font-size: 10px; }
    .data-queue { flex-shrink: 0; max-height: 140px; overflow-y: auto; border-top: 1px solid var(--bg-2); }
    .data-queued { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .data-queued-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-1); }
    .data-type { flex: 0 0 96px; }
    .data-panel .ctl-actions button:disabled { opacity: 0.4; cursor: default; }
    .data-status { margin-top: 6px; font-size: 11px; color: var(--fg-3); overflow-wrap: anywhere; }
    .data-status:empty { display: none; }
    /* Analysis panel (panels/analysis.js) */
    .an-root { height: 100%; overflow-y: auto; padding: 6px 8px 16px; color: var(--fg-1); font-size: 11px; }
    .an-hd { display: flex; align-items: center; gap: 8px; padding: 2px 0 6px; border-bottom: 1px solid var(--bg-2); margin-bottom: 6px; }
    .an-title { font-size: 12px; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.05em; }
    .an-overall { flex: 1; color: var(--fg-3); }
    .an-cancel:disabled { opacity: 0.3; cursor: default; }
    .an-note { color: var(--fg-3); font-size: 10px; margin-bottom: 6px; }
    .an-settings { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
    .an-settings .an-plabel { width: auto; }
    .an-setname { flex: 0 1 90px; min-width: 50px; }
    .an-region { flex: 1; color: var(--fg-2); }
    .an-share { margin-bottom: 4px; }
    .an-offline { margin: 0 0 6px; padding: 4px 6px; border: 1px solid #7f1d1d; border-radius: 3px; }
    .an-setpick { flex: 1; min-width: 60px; }
    .an-btn { flex-shrink: 0; padding: 2px 6px; background: var(--bg-2); border: 1px solid var(--bg-3);
      border-radius: 3px; color: var(--fg-1); font-size: 10px; cursor: pointer; }
    .an-btn:hover:not(:disabled) { background: var(--bg-3); color: var(--fg-0); }
    .an-btn:disabled { opacity: 0.4; cursor: default; }
    .an-step { border: 1px solid var(--bg-2); border-left: 3px solid var(--bg-3); border-radius: 4px; margin-bottom: 6px; background: var(--bg-1); }
    .an-step.an-running { border-left-color: #f59e0b; }
    .an-step.an-done    { border-left-color: #10b981; }
    .an-step.an-error   { border-left-color: #ef4444; }
    .an-step.an-queued  { border-left-color: var(--accent); }
    .an-queued .an-badge { background: var(--accent-bg); color: var(--accent-fg); }
    .an-tabs { display: flex; gap: 2px; margin-bottom: 6px; border-bottom: 1px solid var(--bg-2); }
    .an-tab { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 3px 8px 4px;
      background: none; border: none; border-bottom: 2px solid transparent; color: var(--fg-2); font-size: 11px; cursor: pointer; }
    .an-tab:hover { color: var(--fg-0); }
    .an-tab.an-active { color: var(--fg-0); border-bottom-color: var(--accent); }
    .an-tabstate { font-size: 9px; color: var(--fg-3); }
    .an-run { display: inline-flex; align-items: center; gap: 3px; }
    .an-run svg { width: 10px; height: 10px; }
    .an-add, .an-remove { display: inline-flex; align-items: center; gap: 3px; }
    .an-add svg, .an-remove svg { width: 11px; height: 11px; }
    .an-anpick { font-weight: 600; }
    .an-history { flex: 1; min-width: 0; }
    .an-table { margin-top: 6px; border: 1px solid var(--bg-2); border-radius: 3px; padding: 4px; }
    .an-thd { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .an-ttitle { flex: 1; color: var(--fg-1); font-weight: 600; }
    .an-tfilter { flex: 0 1 120px; }
    .an-twrap { max-height: 260px; overflow: auto; }
    .an-tbl { border-collapse: collapse; width: 100%; font-family: monospace; font-size: 10px; }
    .an-tbl th { position: sticky; top: 0; background: var(--bg-1); color: var(--fg-2); text-align: left;
      padding: 2px 4px; cursor: pointer; white-space: nowrap; border-bottom: 1px solid var(--bg-3); }
    .an-tbl td { padding: 1px 4px; color: var(--fg-1); white-space: nowrap; border-bottom: 1px solid var(--bg-2); }
    .an-trow { cursor: pointer; }
    .an-trow:hover td { background: var(--bg-2); color: var(--fg-0); }
    .an-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000;
      display: flex; align-items: center; justify-content: center; }
    .an-modal { width: min(920px, 92vw); height: min(640px, 86vh); display: flex; flex-direction: column;
      background: var(--bg-0); border: 1px solid var(--bg-3); border-radius: 6px; color: var(--fg-1); font-size: 11px; }
    .an-modal-hd { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px;
      border-bottom: 1px solid var(--bg-2); }
    .an-modal-main { flex: 1; display: flex; min-height: 0; }
    .an-cat-list { width: 260px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--bg-2); padding: 6px; }
    .an-cat-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;
      text-align: left; padding: 6px; margin-bottom: 3px; background: none; border: 1px solid transparent;
      border-radius: 4px; color: var(--fg-1); cursor: pointer; font-size: 11px; }
    .an-cat-item:hover { background: var(--bg-1); }
    .an-cat-item.an-active { background: var(--bg-1); border-color: var(--accent); }
    .an-cat-label { font-weight: 600; }
    .an-cat-brief { color: var(--fg-2); font-size: 10px; }
    .an-cat-detail { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .an-cat-title { font-size: 14px; font-weight: 600; color: var(--fg-0); }
    .an-cat-lead { margin: 4px 0; color: var(--fg-0); }
    .an-cat-desc { color: var(--fg-2); line-height: 1.45; margin: 6px 0 10px; }
    .an-cat-sec { margin-bottom: 10px; }
    .an-cat-sec ul { margin: 2px 0 0 16px; padding: 0; color: var(--fg-1); }
    .an-cat-h { color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; margin-bottom: 3px; }
    .an-cat-step { margin-bottom: 4px; }
    .an-modal-ft { display: flex; justify-content: flex-end; gap: 6px; padding-top: 6px; }
    .an-primary { background: #1d4ed8; border-color: #2563eb; color: #fff; }
    .an-qmark { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 12px;
      margin-left: 4px; padding: 0; border: 1px solid var(--fg-4); border-radius: 50%; background: none;
      color: var(--fg-2); font-size: 8px; line-height: 1; cursor: pointer; vertical-align: 1px; }
    .an-qmark:hover, .an-qmark[aria-expanded=true] { border-color: var(--accent-fg); color: var(--fg-0); background: var(--accent-bg); }
    .an-help { position: fixed; z-index: 1100; width: 260px; padding: 6px 8px 7px; background: var(--bg-0);
      border: 1px solid var(--accent); border-radius: 5px; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      color: var(--fg-1); font-size: 11px; line-height: 1.4; }
    .an-help-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .an-help-title { font-weight: 600; color: var(--fg-0); }
    .an-help-x { background: none; border: none; color: var(--fg-2); font-size: 14px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .an-help-x:hover { color: var(--fg-0); }
    .an-help-fun { margin-top: 4px; color: var(--fg-3); font-family: monospace; font-size: 10px; }
    .an-advtoggle { display: flex; align-items: center; gap: 4px; margin: 4px 0 2px; padding: 1px 0;
      background: none; border: none; color: var(--fg-3); font-size: 10px; cursor: pointer; }
    .an-advtoggle:hover { color: var(--fg-1); }
    .an-advtoggle .an-chev { width: 11px; height: 11px; transition: transform 0.1s; }
    .an-advtoggle.an-open .an-chev { transform: rotate(90deg); }
    .an-advchanged { margin-left: 4px; padding: 0 5px; border-radius: 8px; background: var(--accent-bg); color: var(--accent-fg); }
    .an-advanced { margin-left: 6px; padding-left: 6px; border-left: 1px dashed var(--bg-3); }
    .an-step.an-blocked { opacity: 0.55; }
    .an-step-hd { display: flex; align-items: center; gap: 6px; padding: 5px 6px; cursor: pointer; user-select: none; }
    .an-step-hd:hover .an-step-label { color: var(--fg-0); }
    .an-chev { width: 12px; height: 12px; color: var(--fg-3); transition: transform 0.1s; flex-shrink: 0; }
    .an-collapsed .an-chev { transform: rotate(-90deg); }
    .an-collapsed .an-step-body { display: none; }
    .an-step-label { font-weight: 600; color: var(--fg-1); }
    .an-fun { flex: 1; font-family: monospace; font-size: 10px; color: var(--fg-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .an-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--bg-2); color: var(--fg-2); white-space: nowrap; }
    .an-running .an-badge { background: #78350f; color: #fde68a; }
    .an-done .an-badge    { background: #064e3b; color: #a7f3d0; }
    .an-error .an-badge   { background: #7f1d1d; color: #fecaca; }
    .an-step-body { padding: 2px 8px 6px 24px; }
    .an-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .an-plabel { width: 130px; flex-shrink: 0; color: var(--fg-3); }
    .an-sel { flex: 1; min-width: 0; padding: 2px 4px; background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 3px; color: var(--fg-0); font-size: 11px; outline: none; }
    .an-sel:focus { border-color: var(--fg-4); }
    .an-summary { color: var(--fg-2); margin-top: 3px; }
    .an-progress { padding: 0 6px 5px 6px; }
    .an-pbar { position: relative; height: 4px; border-radius: 2px; background: var(--bg-2); overflow: hidden; }
    .an-pfill { height: 100%; width: 0; background: #f59e0b; transition: width 0.3s; }
    .an-indet .an-pfill { position: absolute; width: 30%; animation: an-slide 1.4s ease-in-out infinite; }
    @keyframes an-slide { 0% { left: -30%; } 100% { left: 100%; } }
    .an-prow { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .an-ptext { flex: 1; color: #fde68a; font-size: 10px; font-variant-numeric: tabular-nums; }
    .an-stop { display: inline-flex; align-items: center; gap: 3px; }
    .an-stop svg { width: 10px; height: 10px; }
    .an-error { color: #fca5a5; margin-top: 3px; font-family: monospace; font-size: 10px; white-space: pre-wrap; }
    .an-labels { margin-top: 4px; }
    .an-lrow { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .an-swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--bg-3); flex-shrink: 0; }
    .an-cl { width: 22px; text-align: right; color: var(--fg-2); font-family: monospace; flex-shrink: 0; }
    .an-linput { width: 120px; flex-shrink: 0; padding: 2px 4px; background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 3px; color: var(--fg-0); font-size: 11px; outline: none; }
    .an-linput:focus { border-color: var(--fg-3); }
    .an-numwrap { flex: 1; min-width: 0; display: flex; gap: 2px; }
    .an-num { font-family: monospace; }
    .an-num.an-invalid { border-color: #ef4444; color: #fca5a5; }
    .an-numwrap { align-items: center; gap: 6px; }
    .an-slider { flex: 1; min-width: 50px; height: 3px; accent-color: var(--fg-4); cursor: pointer; }
    .an-slider:disabled { opacity: 0.3; cursor: default; }
    .an-num { flex: 0 0 58px; }
    .an-num:disabled { opacity: 0.5; }

    /* Every slider as the images' (.range2, below): a 3 px track and a 10 px
       round thumb. .range2's own rules are more specific and keep its stacked
       pair as it is. */
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--bg-3); }
    input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--bg-3); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; margin-top: -3.5px; border-radius: 50%; background: var(--fg-1); border: none;
    }
    input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--fg-1); border: none; }
    input[type=range]:focus-visible::-webkit-slider-thumb { outline: 1px solid var(--fg-2); }
    input[type=range]:disabled::-webkit-slider-thumb { background: var(--fg-4); }
    input[type=range]:disabled::-moz-range-thumb { background: var(--fg-4); }
    /* Two thumbs on one track: two range inputs stacked, only their thumbs
       take the pointer, so each drags its own end */
    .range2 { position: relative; flex: 1; height: 14px; }
    .range2-track, .range2-fill { position: absolute; top: 6px; height: 3px; border-radius: 2px; }
    .range2-track { left: 0; right: 0; background: var(--bg-3); }
    .range2 input[type=range] {
      position: absolute; left: 0; top: 0; width: 100%; height: 14px; margin: 0;
      background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
    }
    .range2 input[type=range]::-webkit-slider-runnable-track { background: none; height: 14px; }
    .range2 input[type=range]::-moz-range-track { background: none; }
    .range2 input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto; cursor: pointer;
      width: 10px; height: 10px; margin-top: 2px; border-radius: 50%; background: var(--fg-1); border: none;
    }
    .range2 input[type=range]::-moz-range-thumb {
      pointer-events: auto; cursor: pointer; width: 10px; height: 10px; border-radius: 50%; background: var(--fg-1); border: none;
    }
    .range2 input[type=range]:focus-visible::-webkit-slider-thumb { outline: 1px solid var(--fg-2); }
    .alpha-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; color: var(--fg-3); }
    .alpha-row label { width: 72px; flex-shrink: 0; }
    .alpha-row input[type=range] { flex: 1; min-width: 0; height: 3px; accent-color: var(--fg-4); cursor: pointer; }
    .alpha-row input[type=range]:disabled { opacity: 0.3; cursor: default; }
    .alpha-row input[type=checkbox] { flex-shrink: 0; cursor: pointer; accent-color: var(--fg-4); }
    .alpha-val { width: 26px; text-align: right; color: var(--fg-2); }

    #main-layout {
      position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    /* The spatial view (spatial/view.ts), always in the dark colours */
    /* The data canvases' dark (--bg-0, as the scatter's), apart from the chrome's --bg-1 */
    .spatial-pane { position: absolute; inset: 0; overflow: hidden; background: var(--view-bg, var(--bg-0)); color: var(--fg-1); }
    .tx-connector { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }
    /* The dock and the tray beside it */
    #workarea { flex: 1; min-height: 0; display: flex; }
    /* The docked panels (panels/dock.ts): dockview's dark theme, in the colour tokens */
    #dock { position: relative; flex: 1; min-width: 0; overflow: hidden; background: var(--bg-0); }
    /* The left tray (panels/drawer.ts): page chrome as the right tray, its right edge drags */
    #drawer { position: relative; flex-shrink: 0; display: none; flex-direction: column; width: var(--drawer-width);
      background: var(--bg-1); border-right: 1px solid var(--bg-2); }
    #drawer.open { display: flex; }
    .drawer-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .drawer-panel { position: relative; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; color: var(--fg-1); }
    #drawer .drawer-sash { left: auto; right: -3px; }
    .dockview-theme-dark.lens-dock {
      --dv-group-view-background-color: var(--bg-0);
      --dv-tabs-and-actions-container-background-color: var(--bg-1);
      --dv-activegroup-visiblepanel-tab-background-color: var(--bg-0);
      --dv-inactivegroup-visiblepanel-tab-background-color: var(--bg-0);
      --dv-activegroup-hiddenpanel-tab-background-color: var(--bg-1);
      --dv-inactivegroup-hiddenpanel-tab-background-color: var(--bg-1);
      --dv-activegroup-visiblepanel-tab-color: var(--fg-1);
      --dv-inactivegroup-visiblepanel-tab-color: var(--fg-2);
      --dv-activegroup-hiddenpanel-tab-color: var(--fg-3);
      --dv-inactivegroup-hiddenpanel-tab-color: var(--fg-4);
      --dv-tab-divider-color: var(--bg-2);
      --dv-separator-border: var(--bg-2);
      --dv-tabs-and-actions-container-height: 28px;
      --dv-tabs-and-actions-container-font-size: 11px;
      --dv-drag-over-background-color: rgba(59, 130, 246, 0.25);
      --dv-paneview-active-outline-color: var(--accent);
      /* A divider between panes lights up when the pointer is on it, as a hint that it drags */
      --dv-active-sash-color: var(--accent);
      --dv-active-sash-transition-delay: 0s;
      --dv-active-sash-transition-duration: 0s;
      font-family: monospace;
    }
    .lens-dock .dv-tab { padding: 0 8px; }
    .lens-dock .dv-default-tab-action { padding: 2px; }
    .stats-pane-body { position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; color: var(--fg-1); }
    .panel-note { margin: auto; padding: 16px; color: var(--fg-4); font-size: 11px; text-align: center; }
    .note-link { background: none; border: none; padding: 0; font: inherit; color: var(--fg-2); text-decoration: underline; cursor: pointer; }
    .note-link:hover { color: var(--fg-0); }
    .dock-actions { position: relative; height: 100%; display: flex; align-items: center; padding: 0 6px; }
    .dock-add { background: none; border: none; color: var(--fg-3); font: 14px monospace; cursor: pointer; padding: 0 4px; }
    .dock-add:hover { color: var(--fg-1); }
    .dock-split { background: none; border: none; color: var(--fg-4); cursor: pointer; padding: 0 3px; display: flex; align-items: center; }
    .dock-split:hover { color: var(--fg-1); }
    .dock-split svg { width: 12px; height: 12px; stroke-width: 1.75; pointer-events: none; }
    .dock-menu {
      display: none; position: absolute; top: 100%; right: 4px; z-index: 1000; flex-direction: column;
      background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 4px; padding: 3px 0; min-width: 100px;
    }
    .dock-menu.open { display: flex; }
    .dock-menu-float { position: fixed; }
    .dock-menu button:disabled { opacity: 0.4; cursor: default; }
    .dock-menu button, .dock-empty button {
      background: none; border: none; color: var(--fg-2); font: 11px monospace; text-align: left;
      padding: 4px 10px; cursor: pointer;
    }
    .dock-menu button:hover, .dock-empty button:hover { background: var(--bg-2); color: var(--fg-0); }
    .dock-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 4px; overflow: auto; color: var(--fg-4); font-size: 11px; }
    .dock-empty .dock-empty-close { margin-top: 8px; color: var(--fg-4); }
    .stats-controls { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 8px; border-bottom: 1px solid var(--bg-2); }
    .stats-ctrl-wrap { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.04em; }
    .stats-ctrl-sel {
      padding: 2px 4px; background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 3px;
      color: var(--fg-2); font-size: 10px; font-family: monospace; outline: none; max-width: 100px;
    }
    .stats-ctrl-sel:focus { border-color: var(--fg-4); }
    .stats-chart-area { flex: 1; overflow: hidden; min-height: 0; }
    /* The tools rail (panels/tools.ts): the page's own actions, a column of
       icons at the left edge */
    #tools-rail { flex-shrink: 0; width: 36px; background: var(--bg-1); border-right: 1px solid var(--bg-2); }
    .tools-bar { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
    /* Preferences sit apart, at the rail's foot */
    .tools-bar [data-act=preferences] { margin-top: auto; }
    .tools-bar .tool-btn { width: 30px; height: 30px; }
    /* The jobs button and its popover (ui/jobs.ts) */
    /* A number on a rail button: running jobs, selection rules */
    .tool-btn:has(> .rail-badge) { position: relative; }
    .rail-badge { position: absolute; top: 1px; right: 1px; min-width: 12px; padding: 0 3px; border-radius: 6px;
      background: var(--accent); color: var(--bg-0); font-size: 9px; line-height: 12px; }
    .rail-badge:empty { display: none; }
    .jobs-btn.busy svg { animation: jobs-pulse 1.2s ease-in-out infinite; color: var(--accent-fg); }
    @keyframes jobs-pulse { 50% { opacity: 0.35; } }
    .jobs-popover { position: fixed; z-index: 1000; width: 280px; max-height: 60vh; overflow-y: auto; padding: 6px 8px;
      background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45); font-size: 11px; color: var(--fg-1); }
    .jobs-head { color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; margin: 4px 0 2px; }
    .jobs-none { color: var(--fg-4); padding: 2px 0 4px; }
    .job-row { padding: 4px 0; border-bottom: 1px solid var(--bg-2); }
    .job-row:last-child { border-bottom: none; }
    .job-head { display: flex; align-items: center; gap: 6px; }
    .job-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-ref, .job-when { flex-shrink: 0; color: var(--fg-3); }
    .job-row.state-error .job-when { color: #f87171; }
    .job-row.state-cancelled .job-when { color: var(--fg-4); }
    .job-bar { height: 3px; margin-top: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
    .job-bar span { display: block; height: 100%; background: var(--accent); }
    .job-what, .job-msg { margin-top: 2px; color: var(--fg-3); overflow-wrap: anywhere; }
    .job-row.state-error .job-msg { color: #fca5a5; }
    :root[data-theme="light"] .job-row.state-error .job-msg { color: #b91c1c; }
    /* The info button's popover (ui/info.ts) */
    .info-popover { width: 320px; max-height: 75vh; }
    /* A flyout from the tools rail (ui/flyout.ts): beside it, down to the bottom bar */
    .flyout { position: fixed; z-index: 900; width: 320px; bottom: 36px; display: flex; flex-direction: column;
      background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
    .flyout-head { flex-shrink: 0; height: 26px; display: flex; align-items: center; padding: 0 4px 0 10px;
      border-bottom: 1px solid var(--bg-2); color: var(--fg-2); font: 11px monospace; }
    .flyout-title { flex: 1; }
    .flyout-close { background: none; border: none; color: var(--fg-3); font-size: 14px; cursor: pointer; padding: 0 6px; }
    .flyout-close:hover { color: var(--fg-0); }
    .flyout-body { position: relative; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; color: var(--fg-1); }
    .info-title { display: flex; align-items: center; gap: 6px; color: var(--fg-0); font-size: 12px; margin: 2px 0 4px; overflow-wrap: anywhere; }
    .info-desc { color: var(--fg-1); margin: 2px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .info-tags { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0 4px; }
    .info-tag { padding: 0 6px; border-radius: 8px; background: var(--accent-bg); color: var(--accent-fg); font-size: 10px; }
    .info-tag.info-temp { background: var(--tag-amber-bg); color: var(--tag-amber-fg); }
    .info-row { display: flex; gap: 8px; line-height: 1.6; }
    .info-key { flex: 0 0 auto; min-width: 72px; color: var(--fg-3); }
    .info-val { flex: 1; min-width: 0; color: var(--fg-1); overflow-wrap: anywhere; }
    .info-val.info-num { text-align: right; font-variant-numeric: tabular-nums; }
    .info-val.info-path { color: var(--fg-2); font-size: 10px; }
    .info-head { color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; margin: 8px 0 2px;
      padding-top: 6px; border-top: 1px solid var(--bg-2); }
    .info-none { color: var(--fg-3); margin-top: 8px; }
    .info-slot { border-top: 1px solid var(--bg-2); }
    .info-slot:first-of-type { margin-top: 8px; }
    .info-slot summary { display: flex; justify-content: space-between; padding: 4px 0; cursor: pointer; color: var(--fg-1); }
    .info-slot summary:hover { color: var(--fg-0); }
    .info-count { color: var(--fg-3); }
    .info-group { padding: 0 0 6px 8px; }
    .info-on { color: var(--fg-3); font-size: 10px; margin-bottom: 2px; }
    .info-items { display: flex; flex-wrap: wrap; gap: 3px; }
    .info-item { padding: 0 5px; border-radius: 3px; background: var(--bg-2); color: var(--fg-1); }
    .info-detail { margin-left: 4px; color: var(--fg-3); font-size: 10px; }

    /* The tray (panels/tray.ts): the controls' sections, a fixed width, and
       the rail that shows and hides them, on the tray's left side */
    /* The tray is page chrome, as the rails are (--bg-1); the views it acts on keep --bg-0 */
    #tray { position: relative; flex-shrink: 0; display: flex; background: var(--bg-1); border-left: 1px solid var(--bg-2); }
    /* The tray's dividers (panels/tray.ts sash()): lit at once under the pointer, as the dock's */
    .lens-sash { position: absolute; z-index: 20; touch-action: none; }
    .lens-sash:hover, .lens-sash.dragging { background: var(--accent); }
    .lens-sash-col { top: 0; bottom: 0; left: 35px; width: 4px; cursor: col-resize; }   /* on the rail's right border (36 px) */
    #tray:not(.open) .lens-sash-col { display: none; }
    .lens-sash-row { left: 0; right: 0; top: -2px; height: 4px; cursor: row-resize; }
    .tray-sections { display: none; width: var(--tray-width); flex-direction: column; overflow-y: auto; }
    #tray.open .tray-sections { display: flex; }
    .tray-rail { width: 36px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;
      background: var(--bg-1); border-right: 1px solid var(--bg-2); }
    .tray-rail .tool-btn { width: 30px; height: 30px; }
    .tray-section { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .tray-head { flex-shrink: 0; height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px;
      background: var(--bg-0); border-bottom: 1px solid var(--bg-2); color: var(--fg-2); font: 11px monospace; }
    .tray-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tray-rail-sep { width: 20px; height: 1px; margin: 2px 0; background: var(--bg-3); }
    /* The layers panel (panels/layers.ts): a collapsible section per layer */
    /* A section's header is a band, set off from its body and the next header */
    .layer-section { border-bottom: 1px solid var(--bg-3); }
    .layer-head { margin: 0; padding: 6px 12px 6px 6px; background: var(--bg-2); }
    .layer-section:not(.collapsed) .layer-head { border-bottom: 1px solid var(--bg-3); }
    .layer-head:hover { background: var(--bg-3); }
    .layer-name { font-weight: 600; color: var(--fg-0); }
    .layer-body { padding-bottom: 6px; }
    .layer-toggle { display: flex; align-items: center; gap: 4px; width: 104px; flex-shrink: 0; padding: 0;
      background: none; border: none; color: var(--fg-1); font: 11px monospace; text-align: left; cursor: pointer; }
    .layer-toggle svg { width: 12px; height: 12px; flex-shrink: 0; transition: transform 0.12s; }
    .layer-section.collapsed .layer-toggle svg { transform: rotate(-90deg); }
    .layer-section.collapsed .layer-body { display: none; }
    .layer-body > .ctl-body { padding-top: 2px; }
    .layer-body .gene-list { max-height: 240px; }
    /* The selection panel (panels/selection.ts): combine, the rules as cards
       in a list that scrolls, the saved selections */
    .selection-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px 6px; font-size: 12px; }
    .selection-panel .ctl-actions { margin-top: 0; margin-bottom: 6px; }
    /* The combine mode's symbol, before the rules (ui/selbar.js) */
    #sel-mode { display: flex; align-items: center; margin-left: 4px; color: var(--fg-2); }
    #sel-mode svg { width: 14px; height: 14px; stroke-width: 1.75; }
    .sel-top { flex-shrink: 0; }
    .sel-head { flex-shrink: 0; margin-top: 4px; }
    .sel-rules { flex: 1; min-height: 72px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
      padding: 2px 0 6px; }
    .rule-card { flex-shrink: 0; padding: 4px 4px 4px 8px; background: var(--bg-1); border: 1px solid var(--bg-2);
      border-left: 2px solid #fde68a; border-radius: 4px; font: 11px monospace; }
    :root[data-theme="light"] .rule-card { border-left-color: #b45309; }
    .rule-head { display: flex; align-items: flex-start; gap: 4px; }
    .rule-label { flex: 1; min-width: 0; color: var(--fg-0); overflow-wrap: anywhere; }
    .rule-x { background: none; border: none; color: var(--fg-3); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
    .rule-x:hover { color: #f87171; }
    .rule-meta { display: flex; gap: 8px; margin-top: 2px; color: var(--fg-3); font-size: 10px; }
    .rule-source { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rule-n { margin-left: auto; white-space: nowrap; }
    .rule-empty { color: var(--fg-4); font-size: 10px; padding: 4px 0; }
    /* Out to the panel's edges, padded back, so the rows flush with them (.rg-list) fit
       inside its scroll box rather than overflowing it sideways */
    .selection-panel .rg { flex-shrink: 0; max-height: 40%; margin: 0 -12px; padding: 0 12px; }
    .tray-body { position: relative; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; color: var(--fg-1); }

    /* The selection bar (ui/selbar.js) */
    #selection-bar {
      position: relative; flex-shrink: 0; height: 28px; display: flex; align-items: center; gap: 8px;
      padding: 0 8px; background: var(--bg-1); border-top: 1px solid var(--bg-2); font-size: 11px; color: var(--fg-2);
    }
    .selbar-sel { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
    /* Wide enough for any count, so the chips after it stay put */
    #sel-count { color: #fde68a; margin: 0 6px; min-width: 18ch; white-space: nowrap; }
    /* How many rules make the selection; opens the selection panel */
    #sel-rules { margin-left: 4px; padding: 1px 8px; background: none; border: 1px solid var(--bg-3); border-radius: 10px;
      color: var(--fg-2); font: 11px monospace; white-space: nowrap; cursor: pointer; }
    #sel-rules:hover { color: var(--fg-0); border-color: var(--fg-4); }
    #sel-rules.empty { color: #fbbf24; border-color: rgba(251,191,36,0.6); }
    :root[data-theme="light"] #sel-rules.empty { color: #b45309; border-color: #d97706; }
    #sel-count.none { color: var(--fg-3); }
    :root[data-theme="light"] #sel-count:not(.none) { color: #b45309; }
    #selection-bar .tool-btn { padding: 3px 5px; }
    #selection-bar .tool-btn svg { width: 13px; height: 13px; }
    #status { color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
    /* The latest error, warning or message from what the page asked R, in
       place of the status line until it times out or is read (ui/log.ts) */
    #notice { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 50%; padding: 1px 6px;
      background: none; border: 1px solid transparent; border-radius: 4px; color: var(--fg-1); font: inherit; cursor: pointer; }
    #notice[hidden] { display: none; }
    #notice:not([hidden]) + #status { display: none; }
    #notice:hover { border-color: var(--bg-3); }
    .notice-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .notice-more { flex-shrink: 0; color: var(--fg-3); }
    #notice.lvl-warning { color: #fcd34d; }
    #notice.lvl-error { color: #fca5a5; border-color: rgba(248,113,113,0.5); }
    :root[data-theme="light"] #notice.lvl-warning { color: #b45309; }
    :root[data-theme="light"] #notice.lvl-error { color: #b91c1c; border-color: #fca5a5; }
    .log-badge.error { background: #ef4444; color: #fff; }

    /* The log (ui/log.ts): over the panels, just above the bar */
    #log-drawer {
      position: absolute; left: 0; right: 0; bottom: 28px; height: min(35vh, 320px); z-index: 900;
      display: flex; flex-direction: column; background: var(--bg-1); border-top: 1px solid var(--bg-3);
      box-shadow: 0 -6px 20px rgba(0,0,0,0.35); font-size: 11px; color: var(--fg-1);
      transform: translateY(calc(100% + 28px)); visibility: hidden;
      transition: transform 0.15s ease-out, visibility 0s 0.15s;
    }
    #log-drawer.open { transform: none; visibility: visible; transition: transform 0.15s ease-out; }
    .log-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--bg-2); }
    .log-title { margin-right: auto; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; }
    .log-filter { padding: 1px 8px; background: none; border: 1px solid var(--bg-3); border-radius: 10px;
      color: var(--fg-2); font: inherit; cursor: pointer; }
    .log-filter.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-fg); }
    .log-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px; }
    .log-row { display: grid; grid-template-columns: auto auto 1fr auto; column-gap: 10px; align-items: baseline;
      padding: 3px 0; border-bottom: 1px solid var(--bg-2); }
    .log-time { color: var(--fg-4); font-variant-numeric: tabular-nums; }
    .log-where { color: var(--fg-3); white-space: nowrap; }
    .log-msg { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .log-tail { display: flex; gap: 6px; color: var(--fg-3); white-space: nowrap; }
    .log-toggle { padding: 0; background: none; border: none; color: var(--fg-3); font: inherit; cursor: pointer; }
    .log-toggle:hover { color: var(--fg-0); }
    .log-items { grid-column: 3 / -1; display: flex; flex-direction: column; gap: 2px; margin-top: 3px;
      padding-left: 8px; border-left: 2px solid var(--bg-3); }
    .log-item { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2); }
    .log-none { padding: 6px 0; color: var(--fg-4); }
    .log-row.lvl-warning .log-msg, .log-item.lvl-warning { color: #fcd34d; }
    .log-row.lvl-error .log-msg, .log-item.lvl-error { color: #fca5a5; }
    :root[data-theme="light"] :is(.log-row.lvl-warning .log-msg, .log-item.lvl-warning) { color: #b45309; }
    :root[data-theme="light"] :is(.log-row.lvl-error .log-msg, .log-item.lvl-error) { color: #b91c1c; }

    .toolbar {
      position: absolute; bottom: 20px;
      left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 3px;
      background: color-mix(in srgb, var(--bg-1) 88%, transparent); border: 1px solid var(--bg-3); border-radius: 6px;
      padding: 4px; pointer-events: all; user-select: none; z-index: 10;
    }
    .tool-btn {
      padding: 5px 7px; background: none; border: 1px solid transparent; border-radius: 4px;
      color: var(--fg-2); cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .tool-btn svg { width: 15px; height: 15px; stroke-width: 1.75; pointer-events: none; }
    .tool-btn:hover { background: var(--bg-3); color: var(--fg-0); }
    .tool-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-fg); }
    /* The tray's rail: its controls are shown most of the time, so shown is the
       plain look and hidden is faded, with no accent */
    .tray-rail .tool-btn[data-tray] { color: var(--fg-4); opacity: 0.6; }
    .tray-rail .tool-btn[data-tray].active { background: none; border-color: transparent; color: var(--fg-2); opacity: 1; }   /* as the tools rail's icons */
    .tray-rail .tool-btn[data-tray]:hover { background: var(--bg-3); color: var(--fg-0); opacity: 1; }
    .tool-sep { width: 1px; height: 16px; background: var(--bg-3); margin: 0 2px; flex-shrink: 0; }
    .tool-group { position: relative; }
    .tool-submenu {
      display: none; flex-direction: column; gap: 3px;
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: color-mix(in srgb, var(--bg-1) 92%, transparent); border: 1px solid var(--bg-3); border-radius: 6px; padding: 4px;
    }
    .tool-group.open .tool-submenu { display: flex; }

    .r-status {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      vertical-align: middle; background: var(--fg-4);
    }
    .r-status.connected    { background: #34d399; }
    .gate { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center;
      background: var(--bg-0); color: var(--fg-0); }
    .gate.visible { display: flex; }
    .gate-box { max-width: 420px; padding: 24px; text-align: center; }
    .gate-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .gate-code { font-family: monospace; font-size: 34px; letter-spacing: 6px; margin-bottom: 12px; }
    .gate-code:empty { display: none; }
    .gate-text { font-size: 12px; color: var(--fg-2); line-height: 1.5; }
    .gate-text:empty { display: none; }
    .gate-btn { margin-top: 12px; padding: 5px 12px; font-size: 12px; cursor: pointer; border-radius: 4px;
      border: 1px solid var(--bg-3); background: var(--bg-2); color: var(--fg-0); }
    .gate-btn:hover { border-color: var(--accent); }
    .claim-bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 2900;
      display: none; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12px; border-radius: 6px;
      background: var(--bg-1); color: var(--fg-0); border: 1px solid var(--accent); }
    .claim-bar.visible { display: flex; }
    .claim-bar .gate-btn { margin-top: 0; }
    .claim-code { width: 5em; padding: 4px 6px; font-family: monospace; font-size: 13px; letter-spacing: 2px;
      border-radius: 4px; border: 1px solid var(--bg-3); background: var(--bg-0); color: var(--fg-0); }
    .claim-note { color: #f87171; }
    .claim-note:empty { display: none; }
    .r-status.disconnected { background: #f87171; }
    /* Stop: one click arms it, a second within CLOSE_ARM_MS stops the viewer */
    #btn-close:disabled { opacity: 0.35; cursor: default; background: none; }
    #btn-close.armed { color: #f87171; border-color: #f87171; }

    .scalebar {
      position: absolute; bottom: 20px; left: 12px;
      pointer-events: none; user-select: none;
      display: flex; flex-direction: column; align-items: flex-start;
    }
    .scalebar-bar {
      height: 6px; border: 2px solid var(--fg-1); border-bottom: none;
      box-sizing: border-box;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    }
    .scalebar-label {
      color: var(--fg-1); font-size: 11px; font-family: monospace;
      margin-top: 3px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .spatial-pane .screenshot {
      position: absolute; bottom: 20px; right: 12px;
      pointer-events: all; z-index: 5;
      opacity: 0.25; transition: opacity 0.2s;
    }
    .spatial-pane .screenshot:hover { opacity: 1; }

    /* No object loaded (launch_lens() without one): the start page in place
       of the panels */
    body.empty #workarea, body.empty .selbar-sel { display: none; }
    body.empty :is(#status, #notice) { margin-left: auto; }
    body.empty #btn-panels { display: none; }
    .start-host { position: relative; flex: 1; overflow: hidden; background: var(--bg-0); color: var(--fg-1); }

    /* The start page (ui/start.ts): in place of the view, or as a dialog */
    .start {
      position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
      width: min(720px, calc(100% - 32px)); max-height: 84%; overflow-y: auto;
      color: var(--fg-1); font-size: 12px; line-height: 1.5;
      display: flex; flex-direction: column; gap: 10px;
    }
    .start.busy { opacity: 0.6; pointer-events: none; }
    .start-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.55); }
    .start-overlay .start {
      background: var(--bg-1); border: 1px solid var(--bg-2); border-radius: 8px; padding: 16px 18px;
    }
    .start-close {
      position: absolute; top: 8px; right: 10px; background: none; border: none;
      color: var(--fg-3); font-size: 18px; cursor: pointer;
    }
    .start-close:hover { color: var(--fg-0); }
    .start-title { font-size: 16px; color: var(--fg-0); }
    .start-body { display: flex; flex-direction: column; gap: 8px; }
    .start-label { font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px; }
    .start-open { display: flex; gap: 6px; }
    .start-input {
      flex: 1; padding: 5px 8px; background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-0); font-size: 12px; font-family: monospace; outline: none;
    }
    .start-input:focus { border-color: var(--fg-4); }
    .start-btn, .start-select {
      padding: 4px 10px; background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-1); font-size: 11px; font-family: monospace; cursor: pointer; white-space: nowrap;
    }
    .start-btn:hover { background: var(--bg-3); color: var(--fg-0); }
    .start-btn.danger { border-color: #7f1d1d; color: #fca5a5; }
    .start-link { align-self: flex-start; background: none; border: none; color: var(--accent-fg); font-family: monospace; font-size: 11px; cursor: pointer; padding: 0; }
    .start-head { display: flex; flex-direction: column; gap: 4px; }
    .start-path b { color: var(--fg-0); }
    .start-list { display: flex; flex-direction: column; border: 1px solid var(--bg-2); border-radius: 6px; }
    .start-list > .start-sub { padding: 8px 10px; }
    .start-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--bg-2); }
    .start-row:first-child { border-top: none; }
    .start-row.recent { cursor: pointer; }
    .start-row.recent:hover { background: rgba(255,255,255,0.04); }
    .start-row.missing { opacity: 0.45; cursor: default; }
    .start-row.current { background: var(--row-sel); }
    .start-main { flex: 1; min-width: 0; }
    .start-name { color: var(--fg-0); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .start-sub { color: var(--fg-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .start-desc { color: var(--fg-2); font-size: 11px; }
    .start-badge { margin-left: 6px; padding: 0 5px; border-radius: 8px; font-size: 10px; background: var(--accent-bg); color: var(--accent-fg); }
    .start-badge.auto { background: var(--bg-2); color: var(--fg-2); }
    .start-actions { display: flex; gap: 6px; align-items: center; }
    .start-toggle { color: var(--fg-2); font-size: 11px; cursor: pointer; }
    .start-hint { color: var(--fg-3); font-size: 11px; margin-top: 6px; }
    .start-status { color: var(--fg-2); font-size: 11px; min-height: 1.5em; }
    .start-status.error { color: #fca5a5; }
    .start-confirm {
      border: 1px solid #7f1d1d; border-radius: 6px; padding: 10px 12px; background: rgba(127,29,29,0.15);
      display: flex; flex-direction: column; gap: 8px;
    }
    .start-confirm-row { display: flex; gap: 6px; }
    .start-confirm-text.error { color: #fca5a5; }
    .start-list > .start-confirm { margin: 0 8px 8px; }
    .start-tabs { display: flex; align-self: flex-start; border: 1px solid var(--bg-3); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .start-tab {
      padding: 4px 12px; background: none; border: none; border-left: 1px solid var(--bg-3);
      color: var(--fg-2); font-size: 11px; font-family: monospace; cursor: pointer;
    }
    .start-tab:first-child { border-left: none; }
    .start-tab:hover { color: var(--fg-0); }
    .start-tab.active { background: var(--bg-3); color: var(--fg-0); }
    .start-tab-n { margin-left: 6px; color: var(--fg-3); }
    .start-pane { display: flex; flex-direction: column; gap: 8px; }
    .start-bulk { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .start-bulk .start-btn:disabled { opacity: 0.45; cursor: default; }
    .start-check { margin: 0; accent-color: var(--accent-fg); cursor: pointer; }
    /* The start page and the dialog follow the theme */
    :root[data-theme="light"] :is(.start-overlay, .start-host) :is(.start-btn.danger, .start-status.error, .start-confirm-text.error) { color: #b91c1c; }
    :root[data-theme="light"] .start-row.recent:hover { background: var(--bg-1); }
  </style>
</head>
<body>
  <div id="main-layout">
    <div id="workarea">
      <!-- The page's own actions (panels/tools.ts) -->
      <div id="tools-rail" data-panel="tools"></div>
      <!-- The left tray: the Analysis panel (panels/drawer.ts) -->
      <div id="drawer"></div>
      <!-- The panels, the spatial view among them (panels/dock.ts) -->
      <div id="dock"></div>
      <!-- The controls (panels/tray.ts) -->
      <div id="tray"></div>
    </div>

    <!-- The page's selection count (ui/selbar.js) and the status line -->
    <div id="selection-bar">
      <span class="r-status" id="r-status" title="R: connecting"></span>
      <button class="tool-btn" id="btn-close" title="stop the viewer (viewer$close())" disabled><i data-lucide="power"></i></button>
      <div class="selbar-sel">
        <span id="sel-mode"></span>
        <button id="sel-rules" style="display:none"></button>
        <span id="sel-count"></span>
      </div>
      <button id="notice" hidden></button>
      <div id="status">initializing…</div>
      <button class="tool-btn" id="btn-log" title="log (viewer$log())"><i data-lucide="scroll-text"></i></button>
      <button class="tool-btn" id="btn-panels" title="show or hide the panels beside the spatial view"><i data-lucide="bar-chart-2"></i></button>
    </div>
    <!-- The log, sliding up from the bar (ui/log.ts) -->
    <div id="log-drawer"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
