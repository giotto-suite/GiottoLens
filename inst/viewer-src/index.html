<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GiottoLens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Colours as tokens, dark by default and light with data-theme="light" on
       the page (ui/theme.ts). The spatial view and the scatter canvas
       (.lens-dark) keep the dark ones in both: their colours (selection,
       uncoloured cells, image channels) are chosen for a dark background.
       color-scheme sets the browser's own controls to match. */
    :root, #spatial-pane, .lens-dark {
      color-scheme: dark;
      --bg-0: #0d1117; --bg-1: #111827; --bg-2: #1f2937; --bg-3: #374151;
      --fg-0: #e5e7eb; --fg-1: #d1d5db; --fg-2: #9ca3af; --fg-3: #6b7280; --fg-4: #4b5563;
      --accent: #3b82f6; --accent-fg: #93c5fd; --accent-bg: #1e3a5f; --accent-bg-hover: #1e4a7f; --row-sel: #1e2d40;
      --tag-green-bg: #1a3a2a; --tag-green-fg: #6ee7b7; --tag-amber-bg: #3a2a1a; --tag-amber-fg: #fcd34d;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg-0: #ffffff; --bg-1: #f3f4f6; --bg-2: #e5e7eb; --bg-3: #d1d5db;
      --fg-0: #111827; --fg-1: #374151; --fg-2: #4b5563; --fg-3: #6b7280; --fg-4: #9ca3af;
      --accent: #3b82f6; --accent-fg: #1d4ed8; --accent-bg: #dbeafe; --accent-bg-hover: #bfdbfe; --row-sel: #dbeafe;
      --tag-green-bg: #d1fae5; --tag-green-fg: #047857; --tag-amber-bg: #fef3c7; --tag-amber-fg: #b45309;
    }
    .lens-dark { background: var(--bg-0); }
    /* Every scrollbar in the viewer's colours, panels made at runtime included */
    * { scrollbar-width: thin; scrollbar-color: var(--bg-3) transparent; }
    body { background: var(--bg-1); overflow: hidden; font-family: monospace; }
    canvas { position: absolute; inset: 0; }

    #hud {
      position: absolute; top: 12px; left: 12px;
      color: var(--fg-1); font-size: 12px; line-height: 1.6;
      background: rgba(17,24,39,0.75); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 5px; padding: 3px 10px;
      pointer-events: none; user-select: none;
    }
    #tx-sample, #sel-count, #cursor-coords { margin-left: 10px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,0.12); color: var(--fg-3); font-size: 11px; }
    #cursor-coords { font-family: monospace; }
    #rule-strip {
      position: absolute; top: 44px; left: 12px; right: 120px; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none;
    }
    .rule-chip {
      pointer-events: auto; display: inline-flex; align-items: center; gap: 4px;
      background: rgba(17,24,39,0.85); border: 1px solid rgba(255,220,50,0.45); border-radius: 10px;
      color: #fde68a; font-size: 11px; padding: 1px 4px 1px 8px; max-width: 320px;
    }
    .rule-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rule-chip.rule-mode { border-color: rgba(156,163,175,0.5); color: var(--fg-2); padding-right: 8px; }
    .rule-chip-x { background: none; border: none; color: var(--fg-2); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
    .rule-chip-x:hover { color: #f87171; }
    #ruler-label {
      position: absolute; display: none; pointer-events: none;
      background: rgba(17,24,39,0.85); border: 1px solid var(--bg-3); border-radius: 4px;
      padding: 2px 6px; color: #fef08a; font-size: 11px; font-family: monospace;
      white-space: nowrap; z-index: 10;
    }
    #ruler-label.visible { display: block; }

    #cell-tooltip {
      position: absolute; display: none; pointer-events: none;
      background: rgba(17,24,39,0.92); border: 1px solid var(--bg-3); border-radius: 4px;
      padding: 5px 8px; color: var(--fg-1); font-size: 11px; font-family: monospace;
      white-space: nowrap; z-index: 11; max-width: 260px;
    }
    #cell-tooltip.visible { display: block; }
    #cell-tooltip .ctt-id { color: #fef08a; }
    #cell-tooltip .ctt-row { display: flex; gap: 8px; line-height: 1.5; }
    #cell-tooltip .ctt-key { color: var(--fg-3); flex: 0 0 auto; }
    #cell-tooltip .ctt-val { color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; }
    #cell-tooltip .ctt-sep { height: 1px; background: var(--bg-2); margin: 3px 0; }
    #cell-tooltip .ctt-overflow { color: var(--fg-4); font-size: 10px; margin-top: 2px; }

    #meta-sel-panel {
      position: absolute; left: 12px; bottom: 60px;
      background: rgba(17,24,39,0.92); border: 1px solid var(--bg-2); border-radius: 6px;
      padding: 8px 10px; display: none; flex-direction: column; gap: 6px;
      pointer-events: all; z-index: 10; min-width: 200px;
    }
    #meta-sel-panel.visible { display: flex; }
    .meta-sel-row { display: flex; gap: 6px; }
    .meta-sel-row select, .meta-sel-row input {
      flex: 1; padding: 4px 6px; background: var(--bg-2);
      border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-0); font-size: 11px; font-family: monospace; outline: none;
    }
    .meta-sel-row select:focus, .meta-sel-row input:focus { border-color: var(--fg-4); }
    #meta-sel-apply {
      padding: 4px 10px; background: var(--accent-bg); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--accent-fg); font-size: 11px; cursor: pointer; white-space: nowrap;
    }
    #meta-sel-apply:hover { background: var(--accent-bg-hover); }

    #tx-lasso-panel {
      position: absolute; right: 12px; bottom: 60px;
      background: rgba(17,24,39,0.95); border: 1px solid var(--bg-3); border-radius: 6px;
      display: none; flex-direction: column;
      pointer-events: all; z-index: 10; width: 220px; max-height: 340px;
    }
    #tx-lasso-panel.visible { display: flex; }
    #tx-lasso-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-bottom: 1px solid var(--bg-2); flex-shrink: 0;
    }
    #tx-lasso-title { font-size: 11px; color: #fbbf24; }
    #tx-lasso-close {
      background: none; border: none; color: var(--fg-3); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 0 2px;
    }
    #tx-lasso-close:hover { color: var(--fg-0); }
    #tx-lasso-results { overflow-y: auto; padding: 4px 0; flex: 1; }
    .tx-gene-row {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 10px; font-size: 11px;
    }
    .tx-gene-row:hover { background: rgba(255,255,255,0.04); }
    .tx-gene-name { flex: 1; color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-gene-bar-wrap { width: 50px; height: 4px; background: var(--bg-2); border-radius: 2px; flex-shrink: 0; }
    .tx-gene-bar { height: 100%; background: #fbbf24; border-radius: 2px; }
    .tx-gene-count { color: var(--fg-2); width: 36px; text-align: right; flex-shrink: 0; }

    #annot-popup {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      background: rgba(17,24,39,0.92); border: 1px solid var(--bg-2); border-radius: 6px;
      padding: 10px 12px; display: none; flex-direction: column; gap: 6px;
      pointer-events: all; z-index: 10; min-width: 160px;
    }
    #annot-popup.visible { display: flex; }
    #annot-type { font-size: 10px; color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.05em; }
    #annot-name {
      width: 100%; padding: 4px 8px; background: var(--bg-2);
      border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-0); font-size: 12px; font-family: monospace; outline: none;
    }
    #annot-name:focus { border-color: var(--fg-4); }

    /* The transcripts panel (panels/transcripts.ts) */
    .gene-head { flex-shrink: 0; border-bottom: 1px solid var(--bg-2); }
    .ctl-input {
      width: 100%; padding: 5px 8px;
      background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-0); font-size: 12px; font-family: monospace; outline: none;
    }
    .ctl-input:focus { border-color: var(--fg-4); }
    .ctl-actions { display: flex; gap: 6px; margin-top: 8px; }
    .ctl-actions button {
      flex: 1; padding: 4px; background: var(--bg-2);
      border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-2); font-size: 11px; font-family: monospace; cursor: pointer;
    }
    .ctl-actions button:hover { background: var(--bg-3); color: var(--fg-0); }
    .ctl-actions button.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-fg); }
    .stats-ctrl-sep { width: 1px; height: 14px; background: var(--bg-3); margin: 0 4px; flex-shrink: 0; align-self: center; }
    .gene-count { color: var(--fg-3); font-size: 11px; margin-left: 6px; align-self: center; }

    .gene-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; font-size: 12px; }

    .gene-row { display: flex; align-items: center; gap: 7px; padding: 3px 12px; cursor: pointer; user-select: none; }
    .gene-row:hover { background: var(--bg-2); }
    .gene-row.selected { background: var(--row-sel); }
    .gene-dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--bg-3); }
    .gene-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gene-row.selected .gene-name { color: var(--fg-0); }
    .gene-row:not(.selected) .gene-name { color: var(--fg-3); }
    .list-overflow { padding: 6px 12px; color: var(--fg-4); font-size: 11px; }

    .annot-list { padding: 6px 0; }
    .annot-row { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 12px; cursor: pointer; user-select: none; }
    .annot-row:hover { background: var(--bg-2); }
    .annot-row.selected { background: var(--row-sel); }
    .annot-type-tag { flex-shrink: 0; font-size: 9px; font-family: monospace; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; }
    .annot-type-tag.polygon   { background: var(--accent-bg); color: var(--accent-fg); }
    .annot-type-tag.rectangle { background: var(--tag-green-bg); color: var(--tag-green-fg); }
    .annot-type-tag.freehand  { background: var(--tag-amber-bg); color: var(--tag-amber-fg); }
    .annot-name-text { flex: 1; font-size: 11px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .annot-unnamed { color: var(--fg-4); font-style: italic; }
    .annot-row-btn { background: none; border: none; padding: 2px; color: var(--fg-4); cursor: pointer; display: flex; align-items: center; flex-shrink: 0; }
    .annot-row-btn:hover { color: var(--fg-2); }
    .annot-row-btn svg { width: 12px; height: 12px; }

    /* Control panels (panels/cells.ts, layers.ts) */
    .ctl-body { padding: 10px 12px; font-size: 12px; }
    .ctl-select {
      flex: 1; min-width: 0; padding: 4px 6px; background: var(--bg-2);
      border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-0); font-size: 11px; font-family: monospace; outline: none;
    }
    .cells-legend { margin-top: 6px; }
    .legend-item { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .legend-label { font-size: 11px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .legend-overflow { font-size: 10px; color: var(--fg-4); padding-top: 2px; }
    .legend-gradient { height: 8px; border-radius: 4px; background: linear-gradient(to right, rgb(0,0,255), rgb(255,0,0)); margin-bottom: 3px; }
    .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--fg-3); font-family: monospace; }
    .scale-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .scale-rev { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--fg-2); cursor: pointer; }
    .scale-rev input { margin: 0; accent-color: var(--fg-4); }
    .scale-btn {
      background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 3px; color: var(--fg-2);
      font-size: 10px; padding: 1px 6px; cursor: pointer;
    }
    .scale-btn:hover { background: var(--bg-3); color: var(--fg-0); }
    .scale-colors { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 5px; }
    .scale-stop { display: inline-flex; align-items: center; gap: 1px; }
    .scale-color { width: 18px; height: 16px; padding: 0; border: 1px solid var(--bg-3); border-radius: 3px; background: none; cursor: pointer; }
    .scale-del { padding: 0 3px; line-height: 12px; }
    .legend-actions { display: flex; gap: 4px; margin-bottom: 4px; }
    .legend-show { flex-shrink: 0; margin: 0; cursor: pointer; accent-color: var(--fg-4); }
    .legend-color { width: 12px; height: 12px; padding: 0; border: none; border-radius: 50%; background: none; flex-shrink: 0; cursor: pointer; }
    .legend-color::-webkit-color-swatch-wrapper { padding: 0; }
    .legend-color::-webkit-color-swatch { border: none; border-radius: 50%; }
    .legend-color::-moz-color-swatch { border: none; border-radius: 50%; }
    .legend-item .legend-label { flex: 1; min-width: 0; cursor: default; }
    .legend-alpha { width: 64px; height: 3px; flex-shrink: 0; accent-color: var(--fg-4); cursor: pointer; }
    .legend-alpha:disabled { opacity: 0.3; cursor: default; }
    .legend-alpha-val { width: 22px; text-align: right; font-size: 10px; color: var(--fg-3); flex-shrink: 0; }
    .legend-off .legend-label { color: var(--fg-4); }
    .legend-off .legend-color { opacity: 0.35; }
    .cells-outline { border-top: 1px solid var(--bg-2); }
    .ctl-subhead { font-size: 11px; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .outline-color { width: 22px; height: 18px; padding: 0; border: 1px solid var(--bg-3); border-radius: 3px; background: none; flex-shrink: 0; cursor: pointer; }
    .outline-hex, .outline-width-num {
      background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 3px; color: var(--fg-0);
      font: inherit; font-size: 11px; padding: 1px 4px;
    }
    .outline-hex { width: 64px; }
    .outline-width-num { width: 58px; }
    .outline-presets { display: flex; gap: 4px; }
    .outline-preset { width: 14px; height: 14px; border: 1px solid var(--fg-4); border-radius: 3px; cursor: pointer; padding: 0; }
    .outline-preset:hover { border-color: var(--fg-0); }
    .img-item { margin-bottom: 6px; }
    .img-item .alpha-row { margin-bottom: 2px; }
    .img-name { flex: 1; color: var(--fg-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-color { width: 18px; height: 14px; padding: 0; border: none; background: none; cursor: pointer; flex-shrink: 0; }
    .img-tag { font-size: 9px; color: var(--fg-2); border: 1px solid var(--bg-3); border-radius: 3px; padding: 0 3px; }
    .img-contrast { display: flex; align-items: center; gap: 6px; padding-left: 22px; font-size: 10px; color: var(--fg-2); }
    .img-contrast span { min-width: 64px; text-align: right; font-family: monospace; }
    .item-off .img-contrast { opacity: 0.35; }
    #reg-pane { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; z-index: 3;
      background: #000; border-right: 2px solid var(--bg-3); }
    #reg-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .reg-pane-label { position: absolute; top: 12px; z-index: 4; pointer-events: none;
      color: var(--fg-1); font-size: 12px; background: rgba(17,24,39,0.75);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 5px; padding: 3px 10px; }
    #reg-pane-label { left: 12px; }
    #reg-ref-label { right: 12px; display: none; }
    #spatial-pane.registering #reg-ref-label { display: block; }
    #spatial-pane.registering #deck-canvas { position: absolute; top: 0; left: 50% !important; width: 50% !important; }
    #spatial-pane.registering #hud, #spatial-pane.registering #rule-strip,
    #spatial-pane.registering #scalebar { left: calc(50% + 12px); }
    #spatial-pane.registering #toolbar { left: 75%; }
    .reg-actions { display: flex; gap: 4px; margin: 4px 0; }
    .reg-actions button {
      padding: 3px 6px; background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 4px;
      color: var(--fg-2); font-size: 11px; font-family: monospace; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .reg-actions button svg { width: 13px; height: 13px; pointer-events: none; }
    .reg-actions button:hover:not(:disabled) { background: var(--bg-3); color: var(--fg-0); }
    .reg-actions button:disabled { opacity: 0.35; cursor: default; }
    .reg-actions button.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-fg); }
    .reg-start { flex: 1; }
    .reg-status { font-size: 11px; color: var(--fg-2); margin: 4px 0; }
    .check-row { cursor: pointer; }
    .reg-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-1); padding: 1px 0; }
    .reg-n { width: 18px; text-align: right; color: var(--fg-2); font-family: monospace; }
    .reg-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid; flex-shrink: 0; }
    .reg-res { flex: 1; font-family: monospace; color: var(--fg-2); }
    /* Two thumbs on one track: two range inputs stacked, only their thumbs
       take the pointer, so each drags its own end */
    .range2 { position: relative; flex: 1; height: 14px; }
    .range2-track, .range2-fill { position: absolute; top: 6px; height: 3px; border-radius: 2px; }
    .range2-track { left: 0; right: 0; background: var(--bg-3); }
    .range2 input[type=range] {
      position: absolute; left: 0; top: 0; width: 100%; height: 14px; margin: 0;
      background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
    }
    .range2 input[type=range]::-webkit-slider-runnable-track { background: none; height: 14px; }
    .range2 input[type=range]::-moz-range-track { background: none; }
    .range2 input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto; cursor: pointer;
      width: 10px; height: 10px; margin-top: 2px; border-radius: 50%; background: var(--fg-1); border: none;
    }
    .range2 input[type=range]::-moz-range-thumb {
      pointer-events: auto; cursor: pointer; width: 10px; height: 10px; border-radius: 50%; background: var(--fg-1); border: none;
    }
    .range2 input[type=range]:focus-visible::-webkit-slider-thumb { outline: 1px solid var(--fg-2); }
    .alpha-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; color: var(--fg-3); }
    .alpha-row label { width: 72px; flex-shrink: 0; }
    .alpha-row input[type=range] { flex: 1; min-width: 0; height: 3px; accent-color: var(--fg-4); cursor: pointer; }
    .alpha-row input[type=range]:disabled { opacity: 0.3; cursor: default; }
    .alpha-row input[type=checkbox] { flex-shrink: 0; cursor: pointer; accent-color: var(--fg-4); }
    .alpha-val { width: 26px; text-align: right; color: var(--fg-2); }

    #main-layout {
      position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      display: flex; overflow: hidden;
    }
    #spatial-pane { position: relative; overflow: hidden; min-width: 150px; background: var(--bg-1); }
    /* The docked panels (panels/dock.ts): dockview's dark theme, in the colour tokens */
    #dock { position: relative; overflow: hidden; min-width: 0; background: var(--bg-0); border-left: 1px solid var(--bg-2); }
    .dockview-theme-dark.lens-dock {
      --dv-group-view-background-color: var(--bg-0);
      --dv-tabs-and-actions-container-background-color: var(--bg-1);
      --dv-activegroup-visiblepanel-tab-background-color: var(--bg-0);
      --dv-inactivegroup-visiblepanel-tab-background-color: var(--bg-0);
      --dv-activegroup-hiddenpanel-tab-background-color: var(--bg-1);
      --dv-inactivegroup-hiddenpanel-tab-background-color: var(--bg-1);
      --dv-activegroup-visiblepanel-tab-color: var(--fg-1);
      --dv-inactivegroup-visiblepanel-tab-color: var(--fg-2);
      --dv-activegroup-hiddenpanel-tab-color: var(--fg-3);
      --dv-inactivegroup-hiddenpanel-tab-color: var(--fg-4);
      --dv-tab-divider-color: var(--bg-2);
      --dv-separator-border: var(--bg-2);
      --dv-tabs-and-actions-container-height: 28px;
      --dv-tabs-and-actions-container-font-size: 11px;
      --dv-drag-over-background-color: rgba(59, 130, 246, 0.25);
      --dv-paneview-active-outline-color: var(--accent);
      font-family: monospace;
    }
    .lens-dock .dv-tab { padding: 0 8px; }
    .lens-dock .dv-default-tab-action { padding: 2px; }
    .stats-pane-body { position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; color: var(--fg-1); }
    .panel-note { margin: auto; padding: 16px; color: var(--fg-4); font-size: 11px; text-align: center; }
    .dock-actions { position: relative; height: 100%; display: flex; align-items: center; padding: 0 6px; }
    .dock-add { background: none; border: none; color: var(--fg-3); font: 14px monospace; cursor: pointer; padding: 0 4px; }
    .dock-add:hover { color: var(--fg-1); }
    .dock-menu {
      display: none; position: absolute; top: 100%; right: 4px; z-index: 1000; flex-direction: column;
      background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 4px; padding: 3px 0; min-width: 100px;
    }
    .dock-menu.open { display: flex; }
    .dock-menu button, .dock-empty button {
      background: none; border: none; color: var(--fg-2); font: 11px monospace; text-align: left;
      padding: 4px 10px; cursor: pointer;
    }
    .dock-menu button:hover, .dock-empty button:hover { background: var(--bg-2); color: var(--fg-0); }
    .dock-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--fg-4); font-size: 11px; }
    .stats-controls { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 8px; border-bottom: 1px solid var(--bg-2); }
    .stats-ctrl-wrap { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.04em; }
    .stats-ctrl-sel {
      padding: 2px 4px; background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: 3px;
      color: var(--fg-2); font-size: 10px; font-family: monospace; outline: none; max-width: 100px;
    }
    .stats-ctrl-sel:focus { border-color: var(--fg-4); }
    .stats-chart-area { flex: 1; overflow: hidden; min-height: 0; }
    .gutter { background: var(--bg-2); background-clip: padding-box; transition: background 0.1s; }
    .gutter:hover { background: var(--bg-3); }
    .gutter.gutter-horizontal { cursor: col-resize; }
    #status { position: absolute; top: 12px; right: 12px; color: var(--fg-3); font-size: 12px; }

    #toolbar {
      position: absolute; bottom: 20px;
      left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 3px;
      background: rgba(17,24,39,0.88); border: 1px solid var(--bg-3); border-radius: 6px;
      padding: 4px; pointer-events: all; user-select: none; z-index: 10;
    }
    .tool-btn {
      padding: 5px 7px; background: none; border: 1px solid transparent; border-radius: 4px;
      color: var(--fg-2); cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .tool-btn svg { width: 15px; height: 15px; stroke-width: 1.75; pointer-events: none; }
    .tool-btn:hover { background: var(--bg-3); color: var(--fg-0); }
    .tool-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-fg); }
    .tool-sep { width: 1px; height: 16px; background: var(--bg-3); margin: 0 2px; flex-shrink: 0; }
    .tool-group { position: relative; }
    .tool-submenu {
      display: none; flex-direction: column; gap: 3px;
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: rgba(17,24,39,0.92); border: 1px solid var(--bg-3); border-radius: 6px; padding: 4px;
    }
    .tool-group.open .tool-submenu { display: flex; }

    #r-status {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-left: 5px; vertical-align: middle; background: var(--fg-4);
    }
    #r-status.connected    { background: #34d399; }
    #r-status.disconnected { background: #f87171; }

    #scalebar {
      position: absolute; bottom: 20px; left: 12px;
      pointer-events: none; user-select: none;
      display: flex; flex-direction: column; align-items: flex-start;
    }
    #scalebar-bar {
      height: 6px; border: 2px solid var(--fg-1); border-bottom: none;
      box-sizing: border-box;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    }
    #scalebar-label {
      color: var(--fg-1); font-size: 11px; font-family: monospace;
      margin-top: 3px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #btn-screenshot {
      position: absolute; bottom: 20px; right: 12px;
      pointer-events: all; z-index: 5;
      opacity: 0.25; transition: opacity 0.2s;
    }
    #btn-screenshot:hover { opacity: 1; }

    /* No object loaded (launch_lens() without one) */
    body.empty #toolbar, body.empty #dock, body.empty .gutter, body.empty #rule-strip,
    body.empty #btn-screenshot { display: none; }
    body.empty #spatial-pane { width: 100% !important; }
    #empty-note {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #9ca3af; font-size: 14px; line-height: 1.6; text-align: center;
    }
    #empty-note code { color: #e5e7eb; }
  </style>
</head>
<body>
  <div id="main-layout">
    <div id="spatial-pane">
      <canvas id="deck-canvas"></canvas>
      <div id="reg-pane" style="display:none"><canvas id="reg-canvas"></canvas><div id="reg-pane-label" class="reg-pane-label"></div></div>
      <div id="reg-ref-label" class="reg-pane-label"></div>
      <svg id="tx-connector" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;">
        <line id="tx-connector-line" x1="0" y1="0" x2="0" y2="0" stroke="#ffff64" stroke-width="1.5" display="none"/>
      </svg>
      <div id="hud">GiottoLens<span id="r-status" title="R connection"></span><span id="tx-sample"></span><span id="sel-count"></span><span id="cursor-coords"></span></div>
      <div id="rule-strip" style="display:none"></div>
      <div id="toolbar">
    <button class="tool-btn active" data-mode="pan" title="pan (or, with any tool, hold Space or drag with the middle button)"><i data-lucide="hand"></i></button>
    <button class="tool-btn" id="btn-fit-spatial" title="zoom to fit"><i data-lucide="maximize-2"></i></button>
    <div class="tool-group" id="group-measure">
      <button class="tool-btn tool-group-btn" id="btn-group-measure" title="measure"><i data-lucide="pencil-ruler"></i></button>
      <div class="tool-submenu">
        <button class="tool-btn" data-mode="ruler" title="ruler"><i data-lucide="ruler"></i></button>
        <button class="tool-btn" data-mode="txlasso" title="transcript lasso — count genes in region"><i data-lucide="scan-search"></i></button>
        <button class="tool-btn" id="tool-clear-measure" title="clear measurements"><i data-lucide="circle-x"></i></button>
      </div>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group" id="group-draw">
      <button class="tool-btn tool-group-btn" id="btn-group-draw" title="draw"><i data-lucide="pencil"></i></button>
      <div class="tool-submenu">
        <button class="tool-btn" data-mode="poly" title="polygon"><i data-lucide="pentagon"></i></button>
        <button class="tool-btn" data-mode="rect" title="rectangle"><i data-lucide="square"></i></button>
        <button class="tool-btn" data-mode="freehand" title="freehand"><i data-lucide="spline"></i></button>
      </div>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group" id="group-select">
      <button class="tool-btn tool-group-btn" id="btn-group-select" title="select"><i data-lucide="mouse-pointer-2"></i></button>
      <div class="tool-submenu">
        <button class="tool-btn" data-mode="lasso" title="lasso (Shift adds, Alt or Ctrl/Cmd subtracts)"><i data-lucide="lasso"></i></button>
        <button class="tool-btn" data-mode="brush" title="brush select ([ and ] resize; Shift adds, Alt or Ctrl/Cmd subtracts)"><i data-lucide="paintbrush-2"></i></button>
        <button class="tool-btn" id="tool-invert-sel" title="invert selection"><i data-lucide="flip-horizontal-2"></i></button>
        <button class="tool-btn" id="tool-meta-sel" title="select by metadata"><i data-lucide="filter"></i></button>
        <button class="tool-btn" id="tool-clear-sel" title="clear selection"><i data-lucide="circle-x"></i></button>
      </div>
    </div>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="btn-crossfilter" title="cross-filter mode (spatial ∩ scatter)"><i data-lucide="filter"></i></button>
    <button class="tool-btn" id="btn-rules" title="show the selection rules"><i data-lucide="list-filter"></i></button>
    <button class="tool-btn" id="btn-stats-toggle" title="show or hide the panels"><i data-lucide="bar-chart-2"></i></button>
  </div>
      <div id="scalebar">
        <div id="scalebar-bar"></div>
        <span id="scalebar-label"></span>
      </div>
      <button class="tool-btn" id="btn-screenshot" title="save screenshot"><i data-lucide="camera"></i></button>
      <div id="ruler-label"></div>
      <div id="cell-tooltip"></div>
      <div id="tx-lasso-panel">
        <div id="tx-lasso-hdr">
          <span id="tx-lasso-title"></span>
          <button id="tx-lasso-close">×</button>
        </div>
        <div id="tx-lasso-results"></div>
      </div>
      <div id="meta-sel-panel">
    <div class="meta-sel-row">
      <select id="meta-sel-col"></select>
      <select id="meta-sel-op">
        <option value="=">=</option>
        <option value="!=">≠</option>
        <option value=">">&gt;</option>
        <option value="<">&lt;</option>
        <option value="LIKE">contains</option>
      </select>
    </div>
    <div class="meta-sel-row">
      <input id="meta-sel-val" type="text" placeholder="value…" autocomplete="off" spellcheck="false">
      <button id="meta-sel-apply">select</button>
    </div>
  </div>
  <div id="annot-popup">
    <span id="annot-type"></span>
    <input id="annot-name" type="text" placeholder="name…" autocomplete="off" spellcheck="false">
    </div>
      <div id="status">initializing…</div>
    </div><!-- /spatial-pane -->

    <div id="dock"></div>

  </div><!-- /main-layout -->

  <script type="module" src="./main.js"></script>
</body>
</html>
